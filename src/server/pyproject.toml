[project]
name = "mathsnap"
version = "0.1.0"
description = "Nhận ảnh bài toán, trả về LaTeX (OCR) và lời giải từng bước (LLM)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations<2.0.0",
    "fastapi==0.111.0",
    "langchain-core==0.2.40",
    "langchain-openai==0.1.20",
    "pix2tex==0.1.2",
    "pydantic>=2.0",
    "python-multipart==0.0.9",
    "supabase==2.4.0",
    "uvicorn==0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.25.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
